services:

  app:
    build: .
    command:
      - bash
      - -c
      - |
        python manage.py migrate
        python manage.py runserver 0:8000
    ports:
      - 127.0.0.1:8000:8000
    environment:
      - PROCESS_MANAGER_URL=drunc_pm:10054
      - SESSION_MANAGER_URL=drunc_sm:50000
      - DATABASE_DIR=/home/dune_user/db
      - CSC_URL
      - CSC_SESSION
      - CSC_SESSION_NAME
    volumes:
      - .:/home/dune_user/app
      - db:/home/dune_user/db
      - ${DRUNC_LOCAL_DEPS:-.}:/mnt/local_deps

  drunc_pm:
    build: ./drunc_docker_service/
    profiles:
      - drunc
    command:
      - bash
      - -c
      - |
        /usr/sbin/sshd &&
        drunc-process-manager --log-level debug /process-manager-kafka.json 10054
    expose:
      - 10054
    environment:
      - CSC_SESSION
    volumes:
      - ${DRUNC_LOCAL_DEPS:-.}:/mnt/local_deps
    depends_on:
      kafka:
        condition: service_healthy

  drunc_sm:
    build: ./drunc_docker_service/
    profiles:
      - drunc
    command:
      - bash
      - -c
      - |
        /boot_session_manager.sh
    expose:
      - 50000
    environment:
      - CSC_SESSION
    volumes:
      - ${DRUNC_LOCAL_DEPS:-.}:/mnt/local_deps
    depends_on:
      kafka:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.1.1
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    expose:
      - 9092
    healthcheck:
      test: [CMD-SHELL, timeout 5s /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1]
      interval: 1s
      timeout: 6s
      retries: 20

  kafka_consumer:
    build: .
    command:
      - bash
      - -c
      - |
        python manage.py kafka_consumer --debug
    environment:
      - KAFKA_ADDRESS=kafka:9092
      - DATABASE_DIR=/home/dune_user/db
    volumes:
      - .:/home/dune_user/app
      - db:/home/dune_user/db
      - ${DRUNC_LOCAL_DEPS:-.}:/mnt/local_deps
    depends_on:
      kafka:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  db:
