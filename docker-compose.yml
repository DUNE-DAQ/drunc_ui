services:

  app:
    build: .
    command:
      - bash
      - -c
      - |
        python manage.py migrate
        python manage.py collectstatic --noinput
        gunicorn drunc_ui.wsgi:application --bind 0.0.0.0:8000
    ports:
      - 127.0.0.1:8000:8000
    environment:
      - DB_HOST=db
      - DB_NAME=postgress
      - DB_USERNAME=postgress
      - DB_PASSWORD=postgress
      - DB_PORT=5432
      - PROCESS_MANAGER_URL=drunc_pm:10054
      - SESSION_MANAGER_URL=drunc_sm:50000
      - STATIC_ROOT=/data/static
      - CSC_URL
      - CSC_SESSION
      - CSC_SESSION_NAME
    volumes:
      - .:/app
      - static:/data/static
      - ${DRUNC_LOCAL_DEPS:-.}:/mnt/local_deps

  drunc_pm:
    build: ./drunc_docker_service/
    profiles:
      - drunc
    command:
      - bash
      - -c
      - |
        /usr/sbin/sshd &&
        drunc-process-manager --log-level debug /process-manager-kafka.json 10054
    expose:
      - 10054
    environment:
      - CSC_SESSION
    volumes:
      - ${DRUNC_LOCAL_DEPS:-.}:/mnt/local_deps
    depends_on:
      kafka:
        condition: service_healthy

  drunc_sm:
    build: ./drunc_docker_service/
    profiles:
      - drunc
    command:
      - bash
      - -c
      - |
        /boot_session_manager.sh
    expose:
      - 50000
    environment:
      - CSC_SESSION
    volumes:
      - ${DRUNC_LOCAL_DEPS:-.}:/mnt/local_deps
    depends_on:
      kafka:
        condition: service_healthy

  kafka:
    image: bitnami/kafka:latest
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    expose:
      - 9092
    healthcheck:
      test: timeout 5s kafka-cluster.sh cluster-id --bootstrap-server localhost:9092
      interval: 1s
      timeout: 6s
      retries: 20

  kafka_consumer:
    build: .
    command:
      - bash
      - -c
      - |
        python manage.py kafka_consumer --debug
    environment:
      - DB_HOST=db
      - POSTGRES_DB=postgress
      - POSTGRES_USER=postgress
      - POSTGRES_PASSWORD=postgress
      - DB_PORT=5432
      - KAFKA_ADDRESS=kafka:9092
    volumes:
      - .:/app
      - ${DRUNC_LOCAL_DEPS:-.}:/mnt/local_deps
    depends_on:
      kafka:
        condition: service_healthy
      app:
        condition: service_started

  db:
    image: postgres:16.0
    volumes:
      - db:/var/lib/postgres/data
    environment:
      - POSTGRES_DB=postgress
      - POSTGRES_USER=postgress
      - POSTGRES_PASSWORD=postgress
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgress]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - 5432:5432

volumes:
  db:
  static:
